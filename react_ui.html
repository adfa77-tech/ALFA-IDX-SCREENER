<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>ALPHA IDX • Pro Terminal IHSG &amp; ISSI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useId } = React;

    const fmtRp = (n) =>
      n != null && !isNaN(Number(n))
        ? "Rp " + Math.round(Number(n)).toLocaleString("id-ID")
        : "-";

    const fmtNum = (n, dec = 0) =>
      n != null && !isNaN(Number(n))
        ? Number(n).toLocaleString("id-ID", {
            minimumFractionDigits: dec,
            maximumFractionDigits: dec,
          })
        : "-";

    const fmtPct = (n) => {
      if (n == null || isNaN(Number(n))) return "-";
      const v = Number(n);
      return (v > 0 ? "+" : "") + v.toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
    };

    const tonePct = (n) => {
      const v = Number(n || 0);
      if (v > 0) return "text-emerald-400";
      if (v < 0) return "text-rose-400";
      return "text-slate-400";
    };

    const signalBadge = (code) => {
      switch (code) {
        case "STRONG_BUY":
          return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
        case "BUY_BREAKOUT":
          return "bg-cyan-500/20 text-cyan-300 border-cyan-500/40";
        case "BOW":
          return "bg-amber-500/20 text-amber-300 border-amber-500/40";
        case "WATCH":
          return "bg-indigo-500/20 text-indigo-300 border-indigo-500/40";
        case "SELL":
          return "bg-rose-500/20 text-rose-300 border-rose-500/40";
        case "AVOID":
          return "bg-red-950/60 text-red-300 border-red-700/50";
        default:
          return "bg-slate-800 text-slate-300 border-slate-700";
      }
    };

    function TickerTape() {
      const ref = useRef(null);
      useEffect(() => {
        const host = ref.current;
        if (!host) return;
        host.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.type = "text/javascript";
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
        s.async = true;
        s.text = JSON.stringify({
          symbols: [
            { description: "IHSG", proName: "IDX:COMPOSITE" },
            { description: "BRIS", proName: "IDX:BRIS" },
            { description: "TLKM", proName: "IDX:TLKM" },
            { description: "ADRO", proName: "IDX:ADRO" },
            { description: "AMMN", proName: "IDX:AMMN" },
            { description: "ANTM", proName: "IDX:ANTM" },
            { description: "ASII", proName: "IDX:ASII" },
            { description: "ICBP", proName: "IDX:ICBP" },
            { description: "PGEO", proName: "IDX:PGEO" },
          ],
          showSymbolLogo: true,
          isTransparent: true,
          displayMode: "adaptive",
          colorTheme: "dark",
          locale: "id",
        });
        wrap.appendChild(s);
        host.appendChild(wrap);
      }, []);
      return <div ref={ref} className="w-full bg-slate-950 border-b border-slate-800/80" />;
    }

    function TradingViewChart({ ticker, interval, expanded }) {
      const ref = useRef(null);
      const rawId = useId().replace(/:/g, "");
      const containerId = `tv_chart_${rawId}`;

      useEffect(() => {
        if (!ticker || !ref.current) return;
        let timer = null;
        const mount = () => {
          if (!ref.current) return;
          if (typeof TradingView !== "undefined") {
            ref.current.innerHTML = "";
            new TradingView.widget({
              autosize: true,
              symbol: "IDX:" + ticker,
              interval: interval || "D",
              timezone: "Asia/Jakarta",
              theme: "dark",
              style: "1",
              locale: "id",
              toolbar_bg: "#0f172a",
              enable_publishing: false,
              allow_symbol_change: true,
              studies: [
                { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
                { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
                "RSI@tv-basicstudies",
                "MACD@tv-basicstudies",
              ],
              container_id: containerId,
            });
          } else {
            timer = setTimeout(mount, 250);
          }
        };
        mount();
        return () => timer && clearTimeout(timer);
      }, [ticker, interval, expanded, containerId]);

      return (
        <div
          id={containerId}
          ref={ref}
          style={{ height: expanded ? "600px" : "440px" }}
          className="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800"
        />
      );
    }

    function TradingViewGauge({ ticker }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        ref.current.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        wrap.style.height = "100%";
        wrap.style.width = "100%";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.type = "text/javascript";
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        s.async = true;
        s.text = JSON.stringify({
          interval: "1D",
          width: "100%",
          isTransparent: true,
          height: "100%",
          symbol: "IDX:" + ticker,
          showIntervalTabs: true,
          displayMode: "multiple",
          locale: "id",
          colorTheme: "dark",
        });
        wrap.appendChild(s);
        ref.current.appendChild(wrap);
      }, [ticker]);
      return <div ref={ref} className="w-full h-[380px] bg-slate-950 rounded-xl overflow-hidden border border-slate-800" />;
    }

    function TradingViewFinancialsWidget({ ticker }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        ref.current.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        wrap.style.height = "100%";
        wrap.style.width = "100%";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.type = "text/javascript";
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-financials.js";
        s.async = true;
        s.text = JSON.stringify({
          colorTheme: "dark",
          isTransparent: true,
          largeChartUrl: "",
          displayMode: "regular",
          width: "100%",
          height: "100%",
          symbol: "IDX:" + ticker,
          locale: "id",
        });
        wrap.appendChild(s);
        ref.current.appendChild(wrap);
      }, [ticker]);
      return <div ref={ref} className="w-full h-[420px] bg-slate-950 rounded-xl overflow-hidden border border-slate-800" />;
    }

    function App() {
      const [tab, setTab] = useState("screener");
      const [market, setMarket] = useState({
        updated_at: "-",
        total_scanned: 0,
        total_issi: 0,
        strong_buy_count: 0,
        source: "TradingView Live Scanner (IDX)",
        stocks: [],
      });
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [clockWib, setClockWib] = useState("");

      // Filter & Seleksi
      const [search, setSearch] = useState("");
      const [onlyIssi, setOnlyIssi] = useState(true);
      const [signalFilter, setSignalFilter] = useState("ALL");
      const [sectorFilter, setSectorFilter] = useState("ALL");
      const [minScore, setMinScore] = useState(0);
      const [selectedTicker, setSelectedTicker] = useState("BRIS");
      const [chartInterval, setChartInterval] = useState("D");
      const [chartExpanded, setChartExpanded] = useState(false);

      // Sub-tab data
      const [sectorsData, setSectorsData] = useState([]);
      const [profileData, setProfileData] = useState(null);
      const [newsData, setNewsData] = useState(null);
      const [compareTickers, setCompareTickers] = useState("BRIS,TLKM,ADRO");
      const [compareData, setCompareData] = useState(null);
      const [btStrategy, setBtStrategy] = useState("BREAKOUT");
      const [btRange, setBtRange] = useState("1y");
      const [btData, setBtData] = useState(null);

      // AI Quant
      const [aiQuestion, setAiQuestion] = useState("");
      const [aiKey, setAiKey] = useState(() => localStorage.getItem("alpha_idx_gemini_key") || "");
      const [aiReport, setAiReport] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);

      // Telegram & ISSI settings
      const [tgToken, setTgToken] = useState(() => localStorage.getItem("alpha_idx_tg_token") || "");
      const [tgChatId, setTgChatId] = useState(() => localStorage.getItem("alpha_idx_tg_chat") || "");
      const [tgMinScore, setTgMinScore] = useState(72);
      const [tgStatus, setTgStatus] = useState("");
      const [issiText, setIssiText] = useState("");
      const [issiStatus, setIssiStatus] = useState("");

      useEffect(() => {
        const tick = () => {
          const now = new Date();
          setClockWib(
            now.toLocaleString("id-ID", {
              timeZone: "Asia/Jakarta",
              dateStyle: "medium",
              timeStyle: "medium",
            }) + " WIB"
          );
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);

      const fetchScan = async (force = false) => {
        setLoading(true);
        setErrorMsg("");
        try {
          const res = await fetch(`/api/scan?force=${force ? 1 : 0}`);
          const data = await res.json();
          if (!res.ok || data.error) {
            throw new Error(data.error || "Gagal memuat data scanner");
          }
          setMarket(data);
          if (data.stocks && data.stocks.length > 0) {
            const exists = data.stocks.some((x) => x.ticker === selectedTicker);
            if (!exists) setSelectedTicker(data.stocks[0].ticker);
          }
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const fetchSectors = async () => {
        try {
          const res = await fetch("/api/sectors");
          const data = await res.json();
          if (res.ok && data.sectors) setSectorsData(data.sectors);
        } catch (_) {}
      };

      const fetchProfile = async (t) => {
        if (!t) return;
        try {
          const res = await fetch(`/api/profile?ticker=${encodeURIComponent(t)}`);
          const data = await res.json();
          if (res.ok) setProfileData(data);
        } catch (_) {}
      };

      const fetchNews = async (t) => {
        if (!t) return;
        try {
          const res = await fetch(`/api/news?ticker=${encodeURIComponent(t)}`);
          const data = await res.json();
          if (res.ok) setNewsData(data);
        } catch (_) {}
      };

      const fetchCompare = async (csv = compareTickers) => {
        try {
          const res = await fetch(`/api/compare?tickers=${encodeURIComponent(csv)}`);
          const data = await res.json();
          if (res.ok && !data.error) setCompareData(data);
        } catch (_) {}
      };

      const fetchBacktest = async (t = selectedTicker, strat = btStrategy, rng = btRange) => {
        try {
          const res = await fetch(
            `/api/backtest?ticker=${encodeURIComponent(t)}&strategy=${encodeURIComponent(strat)}&range_str=${encodeURIComponent(rng)}`
          );
          const data = await res.json();
          setBtData(data);
        } catch (_) {}
      };

      const fetchIssiList = async () => {
        try {
          const res = await fetch("/api/issi");
          const data = await res.json();
          if (res.ok && Array.isArray(data.tickers)) {
            setIssiText(data.tickers.join("\n"));
          }
        } catch (_) {}
      };

      const runAiAnalyze = async (customQ = null) => {
        if (!selectedTicker) return;
        setAiLoading(true);
        try {
          localStorage.setItem("alpha_idx_gemini_key", aiKey);
          const res = await fetch("/api/ai-analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ticker: selectedTicker,
              question: customQ !== null ? customQ : aiQuestion,
              api_key: aiKey,
            }),
          });
          const data = await res.json();
          if (res.ok && !data.error) {
            setAiReport(data);
          } else {
            setAiReport({ qa_answer: data.error || "Gagal menjalankan analisa AI." });
          }
        } catch (e) {
          setAiReport({ qa_answer: e.message });
        } finally {
          setAiLoading(false);
        }
      };

      const sendTelegramAlert = async () => {
        setTgStatus("Mengirim alert...");
        localStorage.setItem("alpha_idx_tg_token", tgToken);
        localStorage.setItem("alpha_idx_tg_chat", tgChatId);
        try {
          const res = await fetch("/api/telegram-send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              bot_token: tgToken,
              chat_id: tgChatId,
              only_issi: onlyIssi,
              min_score: Number(tgMinScore) || 70,
            }),
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            setTgStatus("Gagal: " + (data.error || "Error tidak diketahui"));
          } else {
            setTgStatus(`Terkirim (${data.count} saham) pada ${new Date().toLocaleTimeString("id-ID")}`);
          }
        } catch (e) {
          setTgStatus("Error: " + e.message);
        }
      };

      const saveIssiList = async () => {
        setIssiStatus("Menyimpan...");
        try {
          const res = await fetch("/api/issi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: issiText }),
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            setIssiStatus("Gagal: " + (data.error || "Kode tidak valid"));
          } else {
            setIssiStatus(`Tersimpan ${data.saved} emiten ISSI. Memuat ulang data...`);
            fetchScan(true);
          }
        } catch (e) {
          setIssiStatus("Error: " + e.message);
        }
      };

      useEffect(() => {
        fetchScan(false);
        fetchSectors();
        fetchIssiList();
      }, []);

      useEffect(() => {
        if (!selectedTicker) return;
        fetchProfile(selectedTicker);
        fetchNews(selectedTicker);
        if (tab === "backtest") {
          fetchBacktest(selectedTicker, btStrategy, btRange);
        }
      }, [selectedTicker, tab]);

      const sectorsList = useMemo(() => {
        const set = new Set((market.stocks || []).map((s) => s.sector).filter((x) => x && x !== "-"));
        return ["ALL", ...Array.from(set).sort()];
      }, [market.stocks]);

      const filteredStocks = useMemo(() => {
        const q = search.trim().toLowerCase();
        return (market.stocks || []).filter((s) => {
          if (onlyIssi && !s.is_issi) return false;
          if (signalFilter !== "ALL" && s.signal_code !== signalFilter) return false;
          if (sectorFilter !== "ALL" && s.sector !== sectorFilter) return false;
          if (Number(s.alpha_score || 0) < Number(minScore || 0)) return false;
          if (q) {
            const matchTicker = (s.ticker || "").toLowerCase().includes(q);
            const matchName = (s.name || "").toLowerCase().includes(q);
            const matchInd = (s.industry || "").toLowerCase().includes(q);
            if (!matchTicker && !matchName && !matchInd) return false;
          }
          return true;
        });
      }, [market.stocks, onlyIssi, signalFilter, sectorFilter, minScore, search]);

      const activeStock = useMemo(() => {
        return (
          (market.stocks || []).find((s) => s.ticker === selectedTicker) ||
          filteredStocks[0] ||
          (market.stocks || [])[0] ||
          null
        );
      }, [market.stocks, filteredStocks, selectedTicker]);

      return (
        <div className="min-h-screen flex flex-col">
          <TickerTape />

          {/* Header */}
          <header className="glass sticky top-0 z-30 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center font-mono font-bold text-emerald-300">
                α
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-extrabold tracking-tight text-base sm:text-lg text-white">
                    ALPHA IDX <span className="text-emerald-400">PRO TERMINAL</span>
                  </h1>
                  <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                    IHSG &amp; ISSI
                  </span>
                </div>
                <p className="text-xs text-slate-400">
                  Update: <span className="font-mono text-slate-200">{market.updated_at}</span> • {clockWib}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => setOnlyIssi((v) => !v)}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${
                  onlyIssi
                    ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/50"
                    : "bg-slate-800/80 text-slate-300 border-slate-700"
                }`}
              >
                {onlyIssi ? "✓ Syariah ISSI Only" : "Semua Emiten IDX"}
              </button>
              <button
                onClick={() => {
                  fetchScan(true);
                  fetchSectors();
                }}
                disabled={loading}
                className="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition disabled:opacity-50"
              >
                {loading ? "Scanning..." : "Refresh Live"}
              </button>
            </div>
          </header>

          {/* Ringkasan KPI */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-3 p-4 pb-2">
            <div className="glass rounded-xl p-3.5">
              <div className="text-xs text-slate-400">Total Emiten Terscan</div>
              <div className="text-xl font-mono font-bold text-white mt-1">{fmtNum(market.total_scanned)}</div>
              <div className="text-[11px] text-emerald-400 mt-0.5">ISSI Lolos: {fmtNum(market.total_issi)}</div>
            </div>
            <div className="glass rounded-xl p-3.5">
              <div className="text-xs text-slate-400">Sinyal Strong Buy / Breakout</div>
              <div className="text-xl font-mono font-bold text-emerald-400 mt-1">{fmtNum(market.strong_buy_count)}</div>
              <div className="text-[11px] text-slate-400 mt-0.5">Konfluensi Skor &amp; Volume</div>
            </div>
            <div className="glass rounded-xl p-3.5">
              <div className="text-xs text-slate-400">Emiten Aktif</div>
              <div className="text-xl font-mono font-bold text-cyan-300 mt-1">{activeStock ? activeStock.ticker : "-"}</div>
              <div className="text-[11px] text-slate-400 truncate mt-0.5">{activeStock ? activeStock.name : "-"}</div>
            </div>
            <div className="glass rounded-xl p-3.5">
              <div className="text-xs text-slate-400">Harga Terakhir</div>
              <div className="text-xl font-mono font-bold text-white mt-1">
                {activeStock ? fmtRp(activeStock.close) : "-"}
              </div>
              <div className={`text-xs font-mono mt-0.5 ${activeStock ? tonePct(activeStock.change) : ""}`}>
                {activeStock ? fmtPct(activeStock.change) : "-"}
              </div>
            </div>
          </section>

          {errorMsg && (
            <div className="mx-4 mt-2 p-3 rounded-xl bg-rose-950/60 border border-rose-700/60 text-rose-200 text-xs">
              {errorMsg}
            </div>
          )}

          {/* Navigasi Tab */}
          <nav className="flex items-center gap-1.5 px-4 pt-2 overflow-x-auto border-b border-slate-800/80 pb-2">
            {[
              ["screener", "Screener & Chart"],
              ["sectors", "Rotasi Sektor"],
              ["ai", "Quant AI & Riset"],
              ["compare", "Komparasi Emiten"],
              ["backtest", "Backtest Historis"],
              ["news", "Berita & Dividen"],
              ["settings", "Telegram & ISSI"],
            ].map(([key, label]) => (
              <button
                key={key}
                onClick={() => setTab(key)}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
                  tab === key
                    ? "bg-emerald-500 text-slate-950"
                    : "bg-slate-900/80 text-slate-300 hover:bg-slate-800 border border-slate-800"
                }`}
              >
                {label}
              </button>
            ))}
          </nav>

          {/* Konten Utama */}
          <main className="flex-1 p-4 space-y-4">
            {tab === "screener" && (
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-4">
                {/* Tabel Screener */}
                <div className="xl:col-span-7 glass rounded-xl p-3.5 flex flex-col gap-3">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input
                      type="text"
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Cari kode / emiten..."
                      className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                    <select
                      value={signalFilter}
                      onChange={(e) => setSignalFilter(e.target.value)}
                      className="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white"
                    >
                      <option value="ALL">Semua Sinyal</option>
                      <option value="STRONG_BUY">STRONG BUY</option>
                      <option value="BUY_BREAKOUT">BUY BREAKOUT</option>
                      <option value="BOW">BUY ON WEAKNESS</option>
                      <option value="WATCH">ACCUMULATE / WATCH</option>
                      <option value="NEUTRAL">HOLD / NEUTRAL</option>
                      <option value="SELL">TAKE PROFIT / SELL</option>
                      <option value="AVOID">SELL / AVOID</option>
                    </select>
                    <select
                      value={sectorFilter}

                            fetchNews(d.ticker);
                          }}
                          className="flex items-center justify-between p-2 rounded-lg bg-slate-950/80 border border-slate-800 cursor-pointer hover:border-emerald-500/40"
                        >
                          <div>
                            <span className="font-mono font-bold text-white">{d.ticker}</span>
                            {d.is_issi && (
                              <span className="ml-1.5 text-[10px] px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300">
                                ISSI
                              </span>
                            )}
                            <div className="text-[11px] text-slate-400 truncate max-w-[160px]">{d.name}</div>
                          </div>
                          <div className="text-right font-mono">
                            <div className="text-emerald-300 font-bold">{fmtNum(d.div_yield, 2)}%</div>
                            <div className="text-[11px] text-slate-300">{fmtRp(d.close)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  {activeStock && <TradingViewFinancialsWidget ticker={activeStock.ticker} />}
                </div>
              </div>
            )}

            {tab === "settings" && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="glass rounded-xl p-4 space-y-3 text-xs">
                  <h2 className="font-bold text-sm text-white">Alert Telegram Bot</h2>
                  <div>
                    <label className="block text-slate-400 mb-1">Bot Token</label>
                    <input
                      type="password"
                      value={tgToken}
                      onChange={(e) => setTgToken(e.target.value)}
                      placeholder="123456:ABC-DEF..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 font-mono text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Chat ID</label>
                    <input
                      type="text"
                      value={tgChatId}
                      onChange={(e) => setTgChatId(e.target.value)}
                      placeholder="-100..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 font-mono text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Minimum Alpha Score</label>
                    <input
                      type="number"
                      min="0"
                      max="100"
                      value={tgMinScore}
                      onChange={(e) => setTgMinScore(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 font-mono text-white"
                    />
                  </div>
                  <button
                    onClick={sendTelegramAlert}
                    className="px-4 py-2 rounded-lg font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950"
                  >
                    Kirim Sniper Alert ke Telegram
                  </button>
                  {tgStatus && <div className="text-cyan-300 font-mono">{tgStatus}</div>}
                </div>

                <div className="glass rounded-xl p-4 space-y-3 text-xs">
                  <h2 className="font-bold text-sm text-white">Daftar Saham ISSI Kustom</h2>
                  <p className="text-slate-400">
                    Pisahkan kode emiten dengan baris baru atau koma (contoh: BRIS, TLKM, ADRO).
                  </p>
                  <textarea
                    rows="8"
                    value={issiText}
                    onChange={(e) => setIssiText(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-white"
                  />
                  <button
                    onClick={saveIssiList}
                    className="px-4 py-2 rounded-lg font-bold bg-cyan-400 hover:bg-cyan-300 text-slate-950"
                  >
                    Simpan Daftar ISSI
                  </button>
                  {issiStatus && <div className="text-emerald-300 font-mono">{issiStatus}</div>}
                </div>
              </div>
            )}
          </main>

          <footer className="px-4 py-3 text-[11px] text-slate-500 border-t border-slate-900 flex flex-wrap justify-between gap-2">
            <span>Sumber: {market.source} • Yahoo Finance • Google News ID</span>
            <span>Disclaimer: Analisa kuantitatif &amp; AI bersifat edukasi, bukan ajakan beli/jual mutlak.</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
