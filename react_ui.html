<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALPHA IDX • IHSG & ISSI Screener + AI + Profil Insider</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { background: #070b14; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(14px); border: 1px solid rgba(148, 163, 184, 0.14); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const fmtRp = (n) => (n != null ? "Rp " + Number(n).toLocaleString("id-ID") : "-");

    function TickerTape() {
      const ref = useRef(null);
      useEffect(() => {
        const host = ref.current;
        if (!host || host.childElementCount > 0) return;
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
        s.async = true;
        s.text = JSON.stringify({
          symbols: [
            { description: "IHSG", proName: "IDX:COMPOSITE" },
            { description: "BRIS", proName: "IDX:BRIS" },
            { description: "TLKM", proName: "IDX:TLKM" },
            { description: "ADRO", proName: "IDX:ADRO" },
            { description: "AMMN", proName: "IDX:AMMN" },
            { description: "ANTM", proName: "IDX:ANTM" },
            { description: "ASII", proName: "IDX:ASII" },
            { description: "ICBP", proName: "IDX:ICBP" },
            { description: "PGEO", proName: "IDX:PGEO" },
          ],
          showSymbolLogo: true,
          isTransparent: true,
          displayMode: "adaptive",
          colorTheme: "dark",
          locale: "id",
        });
        wrap.appendChild(s);
        host.appendChild(wrap);
      }, []);
      return <div ref={ref} className="w-full bg-slate-950 border-b border-slate-800/80" />;
    }

    function TradingViewChart({ ticker, interval, expanded }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        let timer = null;
        const mount = () => {
          if (!ref.current) return;
          if (typeof TradingView !== "undefined") {
            ref.current.innerHTML = "";
            new TradingView.widget({
              autosize: true,
              symbol: "IDX:" + ticker,
              interval: interval,
              timezone: "Asia/Jakarta",
              theme: "dark",
              style: "1",
              locale: "id",
              toolbar_bg: "#0f172a",
              enable_publishing: false,
              allow_symbol_change: true,
              studies: [
                { id: "MASimple@tv-basicstudies", inputs: { length: 20 } },
                { id: "MASimple@tv-basicstudies", inputs: { length: 50 } },
                "RSI@tv-basicstudies",
                "MACD@tv-basicstudies",
              ],
              container_id: "tv_react_chart",
            });
          } else {
            timer = setTimeout(mount, 250);
          }
        };
        mount();
        return () => timer && clearTimeout(timer);
      }, [ticker, interval, expanded]);

      return <div id="tv_react_chart" ref={ref} style={{ height: expanded ? "620px" : "460px" }} className="w-full bg-slate-950" />;
    }

    function TradingViewGauge({ ticker }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        ref.current.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        wrap.style.height = "100%";
        wrap.style.width = "100%";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        s.async = true;
        s.text = JSON.stringify({
          interval: "1D",
          width: "100%",
          isTransparent: true,
          height: "100%",
          symbol: "IDX:" + ticker,
          showIntervalTabs: true,
          displayMode: "multiple",
          locale: "id",
          colorTheme: "dark",
        });
        wrap.appendChild(s);
        ref.current.appendChild(wrap);
      }, [ticker]);

      return <div ref={ref} className="w-full h-[380px] bg-slate-950" />;
    }

    function TradingViewProfileWidget({ ticker }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        ref.current.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        wrap.style.height = "100%";
        wrap.style.width = "100%";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-profile.js";
        s.async = true;
        s.text = JSON.stringify({
          width: "100%",
          height: "100%",
          isTransparent: true,
          colorTheme: "dark",
          symbol: "IDX:" + ticker,
          locale: "id",
        });
        wrap.appendChild(s);
        ref.current.appendChild(wrap);
      }, [ticker]);
      return <div ref={ref} className="w-full h-[420px] bg-slate-950" />;
    }

    function TradingViewFinancialsWidget({ ticker }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ticker || !ref.current) return;
        ref.current.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "tradingview-widget-container";
        wrap.style.height = "100%";
        wrap.style.width = "100%";
        const w = document.createElement("div");
        w.className = "tradingview-widget-container__widget";
        wrap.appendChild(w);
        const s = document.createElement("script");
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-financials.js";
        s.async = true;
        s.text = JSON.stringify({
          isTransparent: true,
          largeChartUrl: "",
          displayMode: "regular",
          width: "100%",
          height: "100%",
          colorTheme: "dark",
          symbol: "IDX:" + ticker,
          locale: "id",
        });
        wrap.appendChild(s);
        ref.current.appendChild(wrap);
      }, [ticker]);
      return <div ref={ref} className="w-full h-[640px] bg-slate-950" />;
    }

    function ProfileInsiderView({ stock, allStocks, onSelectTicker, onBackToChart }) {
      const [profData, setProfData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      const loadProfile = async (t) => {
        if (!t) return;
        setLoading(true);
        setErr("");
        try {
          const res = await fetch(`/api/profile?ticker=${encodeURIComponent(t)}`);
          const d = await res.json();
          if (d.error) throw new Error(d.error);
          setProfData(d);
        } catch (e) {
          setErr(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (stock) loadProfile(stock.ticker);
      }, [stock && stock.ticker]);

      if (!stock) {
        return <div className="glass rounded-2xl p-8 text-center text-slate-400">Memuat data saham...</div>;
      }

      const p = profData && profData.profile ? profData.profile : null;
      const own = p && p.ownership ? p.ownership : {};
      const insPct = own.insiders_pct ?? 0;
      const instPct = own.institutions_pct ?? 0;
      const pubPct = own.public_float_pct ?? 0;

      return (
        <div className="space-y-5">
          <div className="glass rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-emerald-500 flex items-center justify-center text-slate-950 text-lg font-extrabold shadow-lg shadow-amber-500/20">
                🏢
              </div>
              <div>
                <div className="flex flex-wrap items-center gap-2">
                  <h2 className="text-base lg:text-lg font-extrabold text-white">Profil Emiten, Pemegang Saham & Insider • <span className="text-amber-300 font-mono">IDX:{stock.ticker}</span></h2>
                  {stock.is_issi && <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">☪ ISSI</span>}
                </div>
                <p className="text-xs text-slate-400">{stock.name} • {stock.sector} • Market Cap Rp {stock.mcap_t} Triliun</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <select
                value={stock.ticker}
                onChange={(e) => onSelectTicker(e.target.value)}
                className="h-9 bg-slate-900 border border-slate-700 rounded-lg px-3 text-xs font-mono text-white focus:outline-none focus:border-amber-400"
              >
                {allStocks.slice(0, 180).map((x) => (
                  <option key={x.ticker} value={x.ticker}>
                    {x.ticker} — {x.name.slice(0, 28)}
                  </option>
                ))}
              </select>
              <a
                href={`https://www.idx.co.id/id/perusahaan-tercatat/profil-perusahaan-tercatat/${stock.ticker}`}
                target="_blank"
                rel="noopener noreferrer"
                className="h-9 inline-flex items-center px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-amber-300 transition"
              >
                🏛️ Keterbukaan BEI ↗
              </a>
              <button
                onClick={() => loadProfile(stock.ticker)}
                className="h-9 px-3 rounded-lg bg-amber-500 hover:bg-amber-400 text-xs font-extrabold text-slate-950 transition"
              >
                ↻ Refresh Data
              </button>
              <button
                onClick={onBackToChart}
                className="h-9 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition"
              >
                ← Kembali ke Chart
              </button>
            </div>
          </div>

          {err && <div className="glass rounded-xl p-3 border-rose-500/40 text-xs text-rose-300">Error: {err}</div>}
          {p && p.yahoo_note && <div className="glass rounded-xl p-3 border-amber-500/30 text-xs text-amber-300">ℹ️ {p.yahoo_note}</div>}

          <div className="glass rounded-2xl p-4 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="text-xs font-bold uppercase text-amber-300">📊 Struktur Kepemilikan Saham & Free Float</div>
              <div className="text-xs font-mono text-slate-400">
                Saham Beredar: <b className="text-white">{own.shares_outstanding_fmt || "-"}</b> • Float: <b className="text-cyan-300">{own.float_shares_fmt || "-"}</b>
              </div>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div className="rounded-xl bg-slate-900/90 border border-amber-500/30 p-3">
                <div className="text-[11px] text-slate-400">Pengendali / Insider</div>
                <div className="text-2xl font-extrabold font-mono text-amber-400 mt-1">{own.insiders_pct != null ? `${own.insiders_pct}%` : "-"}</div>
              </div>
              <div className="rounded-xl bg-slate-900/90 border border-cyan-500/30 p-3">
                <div className="text-[11px] text-slate-400">Institusi / Fund</div>
                <div className="text-2xl font-extrabold font-mono text-cyan-400 mt-1">{own.institutions_pct != null ? `${own.institutions_pct}%` : "-"}</div>
                <div className="text-[10px] text-slate-500">{own.institutions_count != null ? `${own.institutions_count} institusi` : ""}</div>
              </div>
              <div className="rounded-xl bg-slate-900/90 border border-emerald-500/30 p-3">
                <div className="text-[11px] text-slate-400">Estimasi Publik / Free Float</div>
                <div className="text-2xl font-extrabold font-mono text-emerald-400 mt-1">{own.public_float_pct != null ? `${own.public_float_pct}%` : "-"}</div>
              </div>
              <div className="rounded-xl bg-slate-900/90 border border-slate-700 p-3">
                <div className="text-[11px] text-slate-400">Valuasi & Syariah</div>
                <div className="text-sm font-mono font-bold text-white mt-1.5">PER {stock.pe ?? "-"}x • PBV {stock.pbv ?? "-"}x</div>
                <div className="text-[11px] text-emerald-300 mt-0.5">Debt/Asset: {stock.debt_asset_ratio != null ? `${stock.debt_asset_ratio}%` : "-"}</div>
              </div>
            </div>

            {(own.insiders_pct != null || own.institutions_pct != null) && (
              <div className="space-y-1">
                <div className="w-full h-3 rounded-full bg-slate-800 overflow-hidden flex">
                  <div style={{ width: `${insPct}%` }} className="bg-amber-400 h-full" title={`Insider ${insPct}%`} />
                  <div style={{ width: `${instPct}%` }} className="bg-cyan-400 h-full" title={`Institusi ${instPct}%`} />
                  <div style={{ width: `${pubPct}%` }} className="bg-emerald-400 h-full" title={`Publik ${pubPct}%`} />
                </div>
                <div className="flex flex-wrap gap-4 text-[10px] text-slate-400">
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-amber-400 inline-block" /> Insider ({insPct}%)</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-cyan-400 inline-block" /> Institusi ({instPct}%)</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-emerald-400 inline-block" /> Publik / Lainnya ({pubPct}%)</span>
                </div>
              </div>
            )}
          </div>

          {loading && <div className="glass rounded-xl p-6 text-center text-xs text-amber-300 animate-pulse">Mengambil data Direksi, Pemegang Saham & Transaksi Insider IDX:{stock.ticker}...</div>}

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
            <div className="xl:col-span-6 space-y-5">
              <div className="glass rounded-2xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <div className="text-xs font-bold uppercase text-cyan-300">🏢 Tentang Perusahaan & Manajemen</div>
                  {p && p.website && (
                    <a href={p.website} target="_blank" rel="noopener noreferrer" className="text-xs text-emerald-400 hover:underline font-mono">
                      {p.website} ↗
                    </a>
                  )}
                </div>
                {p && p.address && (
                  <div className="text-[11px] text-slate-400">
                    📍 {p.address} {p.employees ? `• 👥 ${Number(p.employees).toLocaleString("id-ID")} Karyawan` : ""}
                  </div>
                )}
                {p && p.summary ? (
                  <p className="text-xs text-slate-300 leading-relaxed max-h-40 overflow-y-auto pr-1">{p.summary}</p>
                ) : (
                  <p className="text-xs text-slate-400">Ringkasan detail tersedia pada widget TradingView di bawah.</p>
                )}

                {p && p.officers && p.officers.length > 0 && (
                  <div className="pt-2 border-t border-slate-800 space-y-2">
                    <div className="text-[11px] font-bold uppercase text-slate-300">👔 Jajaran Direksi & Komisaris</div>
                    <div className="overflow-x-auto max-h-56 overflow-y-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="text-[10px] uppercase text-slate-500 border-b border-slate-800">
                          <tr><th className="py-1.5">Nama</th><th className="py-1.5">Jabatan</th><th className="py-1.5 text-right">Usia</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {p.officers.map((o, idx) => (
                            <tr key={idx}>
                              <td className="py-1.5 font-semibold text-white">{o.name}</td>
                              <td className="py-1.5 text-slate-300">{o.title}</td>
                              <td className="py-1.5 text-right font-mono text-slate-400">{o.age ?? "-"}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>

              <div className="glass rounded-2xl overflow-hidden">
                <div className="px-4 py-2.5 border-b border-slate-800 text-xs font-bold text-slate-300">
                  Profil Resmi TradingView (IDX:{stock.ticker})
                </div>
                <TradingViewProfileWidget ticker={stock.ticker} />
              </div>
            </div>

            <div className="xl:col-span-6 space-y-5">
              <div className="glass rounded-2xl p-4 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="text-xs font-bold uppercase text-emerald-300">🕵️ Aktivitas & Pemegang Insider</div>
                  {p && p.net_insider_activity && (
                    <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-cyan-300">
                      Beli: {p.net_insider_activity.buy_count}x ({p.net_insider_activity.buy_shares}) • Jual: {p.net_insider_activity.sell_count}x ({p.net_insider_activity.sell_shares})
                    </span>
                  )}
                </div>

                {p && p.insider_holders && p.insider_holders.length > 0 && (
                  <div className="space-y-1.5">
                    <div className="text-[11px] font-bold text-slate-400">Daftar Pemegang Insider / Direksi Tercatat</div>
                    <div className="overflow-x-auto max-h-48 overflow-y-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="text-[10px] uppercase text-slate-500 border-b border-slate-800">
                          <tr><th className="py-1.5">Nama</th><th className="py-1.5">Relasi</th><th className="py-1.5 text-right">Saham</th><th className="py-1.5 text-right">Tanggal</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {p.insider_holders.map((h, idx) => (
                            <tr key={idx}>
                              <td className="py-1.5 font-semibold text-white">{h.name}</td>
                              <td className="py-1.5 text-slate-300">{h.relation}</td>
                              <td className="py-1.5 text-right font-mono text-amber-300">{h.shares}</td>
                              <td className="py-1.5 text-right font-mono text-slate-400">{h.date}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t border-slate-800 space-y-1.5">
                  <div className="text-[11px] font-bold text-slate-400">Riwayat Transaksi Insider Terbaru</div>
                  {p && p.insider_transactions && p.insider_transactions.length > 0 ? (
                    <div className="overflow-x-auto max-h-56 overflow-y-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="text-[10px] uppercase text-slate-500 border-b border-slate-800">
                          <tr><th className="py-1.5">Pelaku</th><th className="py-1.5">Transaksi</th><th className="py-1.5 text-right">Lembar</th><th className="py-1.5 text-right">Tanggal</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {p.insider_transactions.map((tx, idx) => {
                            const txt = (tx.text || "").toLowerCase();
                            const isBuy = txt.includes("buy") || txt.includes("purchase") || txt.includes("beli");
                            const isSell = txt.includes("sell") || txt.includes("sale") || txt.includes("jual");
                            return (
                              <tr key={idx}>
                                <td className="py-1.5">
                                  <div className="font-semibold text-white">{tx.name}</div>
                                  <div className="text-[10px] text-slate-400">{tx.relation}</div>
                                </td>
                                <td className={`py-1.5 font-semibold ${isBuy ? "text-emerald-400" : isSell ? "text-rose-400" : "text-slate-300"}`}>
                                  {tx.text}
                                </td>
                                <td className="py-1.5 text-right font-mono text-white">{tx.shares}</td>
                                <td className="py-1.5 text-right font-mono text-slate-400">{tx.date}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ) : (
                    <div className="text-xs text-slate-400 bg-slate-900/70 border border-slate-800 rounded-lg p-3 leading-relaxed">
                      Belum ada feed transaksi insider otomatis untuk emiten ini di Yahoo Finance (umum untuk sebagian emiten BEI). Klik tombol <b>🏛️ Keterbukaan BEI ↗</b> di kanan atas untuk mengecek laporan kepemilikan ≥5% & direksi resmi dari Bursa Efek Indonesia.
                    </div>
                  )}
                </div>
              </div>

              <div className="glass rounded-2xl p-4 space-y-3">
                <div className="text-xs font-bold uppercase text-cyan-300">🏛️ Top Pemegang Saham Institusi & Reksa Dana</div>
                {p && ((p.institutions && p.institutions.length > 0) || (p.funds && p.funds.length > 0)) ? (
                  <div className="space-y-3">
                    {p.institutions && p.institutions.length > 0 && (
                      <div>
                        <div className="text-[11px] font-bold text-slate-400 mb-1">Top Institusi</div>
                        <div className="overflow-x-auto max-h-48 overflow-y-auto">
                          <table className="w-full text-left text-xs">
                            <thead className="text-[10px] uppercase text-slate-500 border-b border-slate-800">
                              <tr><th className="py-1.5">Institusi</th><th className="py-1.5 text-right">Porsi</th><th className="py-1.5 text-right">Lembar</th><th className="py-1.5 text-right">Laporan</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              {p.institutions.map((ins, idx) => (
                                <tr key={idx}>
                                  <td className="py-1.5 font-semibold text-white">{ins.name}</td>
                                  <td className="py-1.5 text-right font-mono text-cyan-300">{ins.pct}%</td>
                                  <td className="py-1.5 text-right font-mono text-slate-200">{ins.shares}</td>
                                  <td className="py-1.5 text-right font-mono text-slate-400">{ins.date}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">LIVE + AI + INSIDER</span>
                  </div>
                  <p className="text-xs text-slate-400">Quant Screener • Deep AI Analyst • Profil & Insider</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActivePage("SCREENER")}
                  className={`h-8 px-3 rounded-lg text-xs font-bold transition ${activePage === "SCREENER" ? "bg-emerald-500 text-slate-950 shadow" : "text-slate-300 hover:text-white"}`}
                >
                  📊 Screener & Chart
                </button>
                <button
                  onClick={() => setActivePage("AI")}
                  className={`h-8 px-3 rounded-lg text-xs font-bold transition ${activePage === "AI" ? "bg-gradient-to-r from-violet-500 to-cyan-500 text-white shadow" : "text-slate-300 hover:text-white"}`}
                >
                  🤖 Analisa AI
                </button>
                <button
                  onClick={() => setActivePage("PROFILE")}
                  className={`h-8 px-3 rounded-lg text-xs font-bold transition ${activePage === "PROFILE" ? "bg-gradient-to-r from-amber-400 to-emerald-400 text-slate-950 shadow" : "text-slate-300 hover:text-white"}`}
                >
                  🏢 Profil & Insider
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <span className={`h-9 inline-flex items-center text-xs font-mono px-3 rounded-lg border ${error ? "bg-rose-500/10 border-rose-500/30 text-rose-300" : "bg-emerald-500/10 border-emerald-500/30 text-emerald-300"}`}>
                  {loading ? "Memuat data..." : (error ? error : `LIVE • ${meta.updated_at}`)}
                </span>
                <button onClick={openIssiModal} className="h-9 inline-flex items-center gap-1 px-3 text-xs font-semibold rounded-lg bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-emerald-300 transition">
                  ☪ ISSI
                </button>
                <button onClick={exportCsv} className="h-9 inline-flex items-center gap-1 px-3 text-xs font-semibold rounded-lg bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-slate-200 transition">
                  📥 CSV
                </button>
                <button onClick={() => fetchScan(true)} className="h-9 inline-flex items-center gap-1 px-3.5 text-xs font-extrabold rounded-lg bg-gradient-to-r from-emerald-400 to-cyan-400 hover:brightness-110 text-slate-950 shadow-lg shadow-emerald-500/20 transition">
                  ↻ Scan
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-[1800px] w-full mx-auto p-4 lg:p-6 space-y-4">
            {activePage === "AI" ? (
              <DeepAiView
                stock={selected}
                allStocks={filtered.length > 0 ? filtered : stocks}
                onSelectTicker={(t) => setSelectedTicker(t)}
                onBackToChart={() => setActivePage("SCREENER")}
              />
            ) : activePage === "PROFILE" ? (
              <ProfileInsiderView
                stock={selected}
                allStocks={filtered.length > 0 ? filtered : stocks}
                onSelectTicker={(t) => setSelectedTicker(t)}
                onBackToChart={() => setActivePage("SCREENER")}
              />
            ) : (
              <>
                {topAlerts.length > 0 && (
                  <div className="glass rounded-xl px-4 py-2.5 flex flex-wrap items-center gap-2">
                    <span className="text-[11px] font-bold uppercase text-emerald-400 mr-1">🔥 Sinyal Terkuat:</span>
                    {topAlerts.map((a) => (
                      <button
                        key={a.ticker}
                        onClick={() => setSelectedTicker(a.ticker)}
                        className="h-7 px-2.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/25 border border-emerald-500/30 text-xs font-mono text-white inline-flex items-center gap-1.5 transition"
                      >
                        <span className="font-bold text-emerald-300">{a.ticker}</span>
                        <span className="text-[10px] text-slate-300">Skor {a.alpha_score}</span>
                      </button>
                    ))}
                  </div>
                )}

                <section className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="glass rounded-xl p-3.5"><div className="text-xs text-slate-400">Emiten IDX</div><div className="text-2xl font-extrabold font-mono text-white mt-1">{meta.total_scanned}</div></div>
                  <div className="glass rounded-xl p-3.5"><div className="text-xs text-slate-400">Lolos ISSI Syariah</div><div className="text-2xl font-extrabold font-mono text-emerald-400 mt-1">{meta.total_issi}</div></div>
                  <div className="glass rounded-xl p-3.5"><div className="text-xs text-slate-400">Strong Buy / Breakout</div><div className="text-2xl font-extrabold font-mono text-cyan-400 mt-1">{meta.strong_buy_count}</div></div>
                  <div className="glass rounded-xl p-3.5"><div className="text-xs text-slate-400">Saham Terpilih</div><div className="text-2xl font-extrabold font-mono text-amber-400 mt-1">{selected ? selected.ticker : "-"}</div></div>
                </section>

                <section className="glass rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap gap-2">
                    {presets.map(([k, lbl]) => (
                      <button
                        key={k}
                        onClick={() => setPreset(k)}
                        className={`h-8 px-3 rounded-lg text-xs inline-flex items-center transition ${preset === k ? "bg-emerald-500 text-slate-950 font-extrabold shadow-md shadow-emerald-500/20" : "bg-slate-800/90 text-slate-300 hover:bg-slate-700 border border-slate-700/60 font-semibold"}`}
                      >
                        {lbl}
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <label className="h-8 inline-flex items-center gap-2 px-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 cursor-pointer text-xs font-bold text-emerald-300">
                      <input type="checkbox" checked={onlyIssi} onChange={(e) => setOnlyIssi(e.target.checked)} className="accent-emerald-400" />
                      ☪ Khusus ISSI Syariah
                    </label>
                    <select value={minVal} onChange={(e) => setMinVal(Number(e.target.value))} className="h-8 bg-slate-900 border border-slate-700 rounded-lg px-2.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-400">
                      <option value={0}>Semua Likuiditas</option>
                      <option value={1}>Transaksi ≥ Rp 1 Miliar</option>
                      <option value={5}>Transaksi ≥ Rp 5 Miliar</option>
                      <option value={20}>Transaksi ≥ Rp 20 Miliar</option>
                    </select>
                    <input
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Cari kode (BRIS, TLKM)..."
                      className="h-8 bg-slate-900 border border-slate-700 rounded-lg px-3 text-xs text-white w-48 focus:outline-none focus:border-emerald-400"
                    />
                  </div>
                </section>

                <section className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
                  <div className={`${expanded ? "xl:col-span-12 order-2" : "xl:col-span-7"} glass rounded-2xl overflow-hidden`}>
                    <div className="px-4 py-3 border-b border-slate-800 flex justify-between text-xs">
                      <span className="font-bold uppercase text-slate-300">Hasil Screening (<span className="text-emerald-400 font-mono">{filtered.length}</span> Saham)</span>
                      <span className="text-slate-400">Klik ★ untuk Watchlist • Klik baris untuk Chart</span>
                    </div>
                    <div className="overflow-x-auto max-h-[760px] overflow-y-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-900/95 sticky top-0 z-10 text-[11px] uppercase text-slate-400 border-b border-slate-800">
                          <tr>
                            <th className="py-2.5 px-3 cursor-pointer hover:text-white" onClick={() => handleSort("ticker")}>Saham</th>
                            <th className="py-2.5 px-2 text-right cursor-pointer hover:text-white" onClick={() => handleSort("close")}>Harga</th>
                            <th className="py-2.5 px-2 text-right cursor-pointer hover:text-white" onClick={() => handleSort("alpha_score")}>Skor α</th>
                            <th className="py-2.5 px-2">Rekomendasi</th>
                            <th className="py-2.5 px-2 text-right">Area Beli / SL</th>
                            <th className="py-2.5 px-2 text-right">TP1 / TP2</th>
                            <th className="py-2.5 px-2 text-right cursor-pointer hover:text-white" onClick={() => handleSort("rvol")}>RVOL / RSI</th>
                            <th className="py-2.5 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort("value_traded_b")}>Val (M)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60">
                          {filtered.slice(0, 200).map((s) => {
                            const isActive = selected && selected.ticker === s.ticker;
                            const isFav = watchlist.includes(s.ticker);
                            return (
                              <tr
                                key={s.ticker}
                                onClick={() => setSelectedTicker(s.ticker)}
                                className={`cursor-pointer hover:bg-slate-800/60 transition ${isActive ? "bg-emerald-500/15 shadow-[inset_3px_0_0_#10b981]" : ""}`}
                              >
                                <td className="py-2.5 px-3">
                                  <div className="flex items-center gap-1.5">
                                    <button onClick={(e) => toggleWatchlist(e, s.ticker)} className={`text-sm leading-none ${isFav ? "text-amber-400" : "text-slate-600 hover:text-amber-300"}`}>★</button>
                                    <span className="font-mono font-bold text-white text-sm">{s.ticker}</span>
                                    {s.is_issi && <span className="px-1 text-[9px] font-bold rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">ISSI</span>}
                                  </div>
                                  <div className="text-[10px] text-slate-400 truncate max-w-[140px] pl-5">{s.name}</div>
                                </td>
                                <td className="py-2.5 px-2 text-right font-mono">
                                  <div className="font-bold text-white">{s.close.toLocaleString("id-ID")}</div>
                                  <div className={`text-[11px] font-bold ${s.change > 0 ? "text-emerald-400" : s.change < 0 ? "text-rose-400" : "text-slate-300"}`}>
                                    {s.change > 0 ? "+" : ""}{s.change}%
                                  </div>
                                </td>
                                <td className="py-2.5 px-2 text-right font-mono font-extrabold text-white">{s.alpha_score}</td>
                                <td className="py-2.5 px-2">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold border whitespace-nowrap ${sigBadge(s.signal_code)}`}>{s.signal}</span>
                                </td>
                                <td className="py-2.5 px-2 text-right font-mono">
                                  <div className="text-cyan-300">{s.plan.entry_low.toLocaleString("id-ID")}–{s.plan.entry_high.toLocaleString("id-ID")}</div>
                                  <div className="text-rose-400 text-[10px]">SL {s.plan.stop_loss.toLocaleString("id-ID")}</div>
                                </td>
                                <td className="py-2.5 px-2 text-right font-mono">
                                  <div className="text-emerald-400">{s.plan.tp1.toLocaleString("id-ID")} (+{s.plan.tp1_pct}%)</div>
                                  <div className="text-amber-300 text-[10px]">TP2 {s.plan.tp2.toLocaleString("id-ID")}</div>
                                </td>
                                <td className="py-2.5 px-2 text-right font-mono">
                                  <div className={s.rvol >= 1.5 ? "text-cyan-300 font-bold" : "text-slate-300"}>{s.rvol}x</div>
                                  <div className="text-[10px] text-slate-400">RSI {s.rsi}</div>
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono text-slate-300">{s.value_traded_b.toFixed(1)}M</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {selected && (
                    <div className={`${expanded ? "xl:col-span-12 order-1" : "xl:col-span-5 xl:sticky xl:top-20"} space-y-4`}>
                      <div className="glass rounded-2xl p-4 space-y-3">
                        <div className="flex justify-between items-start gap-2">
                          <div>
                            <div className="flex flex-wrap items-center gap-2">
                              <h2 className="text-2xl font-extrabold font-mono text-white">IDX:{selected.ticker}</h2>
                              {selected.is_issi && <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">☪ ISSI</span>}
                              <span className={`px-2 py-0.5 text-[10px] font-bold rounded border ${sigBadge(selected.signal_code)}`}>{selected.signal}</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-0.5">{selected.name} • {selected.sector}</p>
                          </div>
                          <div className="text-right">
                            <div className="text-2xl font-extrabold font-mono text-white">{fmtRp(selected.close)}</div>
                            <div className={`text-xs font-mono font-bold ${selected.change >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                              {selected.change > 0 ? "+" : ""}{selected.change}% • Val Rp {selected.value_traded_b} M
                            </div>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => setActivePage("AI")}
                            className="h-9 rounded-xl bg-gradient-to-r from-violet-500/90 to-cyan-500/90 hover:brightness-110 text-xs font-extrabold text-white flex items-center justify-center gap-1.5 transition"
                          >
                            <span>🤖</span><span>Analisa AI ({selected.ticker})</span>
                          </button>
                          <button
                            onClick={() => setActivePage("PROFILE")}
                            className="h-9 rounded-xl bg-gradient-to-r from-amber-400/90 to-emerald-400/90 hover:brightness-110 text-xs font-extrabold text-slate-950 flex items-center justify-center gap-1.5 transition"
                          >
                            <span>🏢</span><span>Profil & Insider</span>
                          </button>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                          <div className="rounded-xl bg-slate-900 border border-cyan-500/30 p-2.5"><div className="text-[10px] text-cyan-300 font-bold">AREA BELI</div><div className="text-xs font-mono font-bold text-white mt-0.5">{selected.plan.entry_low.toLocaleString("id-ID")}–{selected.plan.entry_high.toLocaleString("id-ID")}</div></div>
                          <div className="rounded-xl bg-slate-900 border border-rose-500/30 p-2.5"><div className="text-[10px] text-rose-300 font-bold">CUT LOSS</div><div className="text-xs font-mono font-bold text-rose-400 mt-0.5">{selected.plan.stop_loss.toLocaleString("id-ID")} ({selected.plan.sl_pct}%)</div></div>
                          <div className="rounded-xl bg-slate-900 border border-emerald-500/30 p-2.5"><div className="text-[10px] text-emerald-300 font-bold">TARGET 1</div><div className="text-xs font-mono font-bold text-emerald-400 mt-0.5">{selected.plan.tp1.toLocaleString("id-ID")} (+{selected.plan.tp1_pct}%)</div></div>
                          <div className="rounded-xl bg-slate-900 border border-amber-500/30 p-2.5"><div className="text-[10px] text-amber-300 font-bold">TARGET 2</div><div className="text-xs font-mono font-bold text-amber-300 mt-0.5">{selected.plan.tp2.toLocaleString("id-ID")} (+{selected.plan.tp2_pct}%)</div></div>
                        </div>

                        <div className="text-xs text-slate-200 bg-slate-900/80 border border-slate-800 rounded-xl p-3">{selected.plan.note}</div>

                        <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-3 space-y-2">
                          <div className="flex justify-between text-[11px] font-bold">
                            <span className="text-slate-300">KALKULATOR LOT</span>
                            <span className="font-mono text-emerald-400">R:R 1 : {selected.plan.rr}</span>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <input type="number" value={capital} step={1000000} onChange={(e) => setCapital(Number(e.target.value))} className="h-8 bg-slate-950 border border-slate-700 rounded-lg px-2.5 text-xs font-mono text-white" />
                            <input type="number" value={riskPct} step={0.5} min={0.5} max={10} onChange={(e) => setRiskPct(Number(e.target.value))} className="h-8 bg-slate-950 border border-slate-700 rounded-lg px-2.5 text-xs font-mono text-white" />
                          </div>
                          {posCalc && (
                            <div className="text-xs font-mono text-cyan-300">
                              Beli Maks: <b className="text-white">{posCalc.lots} Lot</b> ({fmtRp(posCalc.val)}) • TP1: <b className="text-emerald-400">+{fmtRp(posCalc.profit)}</b> • SL: <b className="text-rose-400">-{fmtRp(posCalc.loss)}</b>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="glass rounded-2xl overflow-hidden">
                        <div className="px-4 py-2.5 border-b border-slate-800 flex justify-between items-center">
                          <span className="text-xs font-bold text-white">Chart Live TradingView: <span className="text-emerald-400 font-mono">IDX:{selected.ticker}</span></span>
                          <div className="flex items-center gap-2">
                            <select value={interval} onChange={(e) => setIntervalTv(e.target.value)} className="h-7 bg-slate-900 border border-slate-700 rounded-md px-2 text-[11px] text-slate-200">
                              <option value="15">15m</option>
                              <option value="60">1 Jam</option>
                              <option value="D">Daily</option>
                              <option value="W">Weekly</option>
                            </select>
                            <button onClick={() => setExpanded(!expanded)} className="h-7 px-2.5 rounded-md bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-semibold text-slate-200 transition">
                              {expanded ? "⤡ Perkecil" : "⤢ Perbesar"}
                            </button>
                          </div>
                        </div>
                        <TradingViewChart ticker={selected.ticker} interval={interval} expanded={expanded} />
                      </div>

                      <div className="glass rounded-2xl overflow-hidden">
                        <div className="px-4 py-2.5 border-b border-slate-800 text-xs font-bold text-slate-300">Speedometer Teknikal TradingView</div>
                        <TradingViewGauge ticker={selected.ticker} />
                      </div>
                    </div>
                  )}
                </section>
              </>
            )}
          </main>

          {showIssiModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass rounded-2xl max-w-lg w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Update Daftar Saham ISSI (DES OJK)</h3>
                  <button onClick={() => setShowIssiModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>
                <textarea value={issiText} onChange={(e) => setIssiText(e.target.value)} rows={8} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-400" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowIssiModal(false)} className="h-9 px-4 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">Batal</button>
                  <button onClick={saveIssiList} className="h-9 px-4 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 hover:bg-emerald-400">Simpan & Scan Ulang</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
